version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pba_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pba_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pba_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-passive_biometric_auth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pba_user} -d ${POSTGRES_DB:-passive_biometric_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pba_network

  redis:
    image: redis:7-alpine
    container_name: pba_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pba_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pba_backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pba_user}:${POSTGRES_PASSWORD:-pba_secret_password}@db:5432/${POSTGRES_DB:-passive_biometric_auth}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - TOTP_ISSUER=PassiveBiometricAuth
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - TRUST_SCORE_THRESHOLD=0.7
    volumes:
      - ./backend:/app
      - ml_models:/app/ml_models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pba_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pba_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pba_network

volumes:
  postgres_data:
  redis_data:
  ml_models:

networks:
  pba_network:
    driver: bridge
